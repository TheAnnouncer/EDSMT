name: Feature request
description: Something EDSMT should do and does not.
title: "[request] "
labels: ["enhancement"]

body:
  - type: markdown
    attributes:
      value: |
        Please search the open and closed issues and `CHANGELOG.md` first; the
        request may already exist or be built.

  - type: textarea
    id: problem
    attributes:
      label: What you are trying to do
      description: >-
        Describe the situation rather than the feature, for example "I cannot
        tell which of six signals I have already worked out without opening
        the map".
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What you think would fix it
      description: Optional.
    validations:
      required: false

  - type: dropdown
    id: area
    attributes:
      label: Which part
      options:
        - The map
        - The overlay
        - Find - the shared database
        - Recording deposits and signals
        - Settings
        - Installer, updates, packaging
        - The community map
        - Something else
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version, from the title bar
      description: >-
        Shown in the app's title bar.
      placeholder: "1.100xx"
    validations:
      required: true

  - type: textarea
    id: elsewhere
    attributes:
      label: Is this done elsewhere
      description: >-
        Optional. If another tool does this well, say how.
    validations:
      required: false
