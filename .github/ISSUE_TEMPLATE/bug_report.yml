name: Bug report
description: Something in EDSMT does not do what it says it does.
title: "[bug] "
labels: ["bug"]

body:
  - type: markdown
    attributes:
      value: |
        **This form is not for security reports.** Report a vulnerability
        privately: the **Security** tab above, then **Report a vulnerability**.
        See `SECURITY.md`.

  - type: input
    id: version
    attributes:
      label: Version, from the title bar
      description: >-
        Shown in the app's title bar. If the app will not start, the version is
        in the Add/Remove Programs entry.
      placeholder: "1.100xx"
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: >-
        What you did, what you expected, and what happened instead.
      placeholder: |
        Pressed Alt+3 on a new body. The deposit appeared in the list but
        the map did not redraw and the status line went red.
    validations:
      required: true

  - type: input
    id: status-line
    attributes:
      label: What the status line said
      description: >-
        The line along the bottom of the window, copied exactly.
      placeholder: "Journal problem: TypeError - see crash.log"
    validations:
      required: true

  - type: input
    id: journal-folder
    attributes:
      label: Your journal folder
      description: >-
        The full path EDSMT is reading, shown in Settings. The folder can be
        redirected by cloud sync or by a compatibility-layer prefix.
      placeholder: 'C:\Users\you\Saved Games\Frontier Developments\Elite Dangerous'
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: How you are running it
      options:
        - Installer (EDSMT-Setup.exe)
        - Portable (EDSMT.exe)
        - From source (RUN.bat)
    validations:
      required: true

  - type: dropdown
    id: game-state
    attributes:
      label: Was Elite Dangerous running
      description: >-
        Most of the app works with the game closed.
      options:
        - Running, and I was in the SRV
        - Running, but not in the SRV
        - Not running
    validations:
      required: true

  - type: textarea
    id: crashlog
    attributes:
      label: crash.log
      description: >-
        From %LOCALAPPDATA%\RadioRaxxla\EDSMT. It exists only if an error
        occurred. Paste the last entry.
      render: text
    validations:
      required: false

  - type: textarea
    id: mining-events
    attributes:
      label: journal-mining-events.log
      description: >-
        Same folder. Attach it if the report is about a deposit type, density
        or signal not being picked up.
      render: text
    validations:
      required: false

  - type: markdown
    attributes:
      value: |
        **Do not paste `settings.json`.** It holds credentials. If the problem
        is a setting, say which setting and what it is set to.
