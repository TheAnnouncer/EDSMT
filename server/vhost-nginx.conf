# nginx — put this in /etc/nginx/sites-available/api.radioraxxla.com
# then:
#   sudo ln -s /etc/nginx/sites-available/api.radioraxxla.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d api.radioraxxla.com
#
# certbot rewrites this file to add the TLS block and the redirect. Nothing
# here touches your existing sites.
#
# Copy vhost-nginx-limits.conf into /etc/nginx/conf.d/ FIRST - this file
# references the zones it defines and nginx -t will fail without them.

server {
    listen 80;
    listen [::]:80;
    server_name api.radioraxxla.com;

    access_log /var/log/nginx/edsmt-api.access.log;
    error_log  /var/log/nginx/edsmt-api.error.log;

    # Deposits arrive in batches, but nobody needs to post a megabyte.
    client_max_body_size 1m;

    # Uploads are the expensive ones and the ones worth abusing, so they get
    # the tight limit. Searching is cheap and a commander flicking through
    # the Find window should never hit a wall, so reads get a loose one.
    location ~ ^/v1/(deposits|depletion|market)$ {
        limit_req   zone=edsmtapi burst=20 nodelay;
        limit_conn  edsmtconn 10;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    location / {
        limit_req   zone=edsmtread burst=40 nodelay;
        limit_conn  edsmtconn 10;

        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }
}
