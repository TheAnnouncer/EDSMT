# Apache — /etc/apache2/sites-available/api.radioraxxla.com.conf
#   sudo a2enmod proxy proxy_http headers
#   sudo a2ensite api.radioraxxla.com
#   sudo apache2ctl configtest && sudo systemctl reload apache2
#   sudo certbot --apache -d api.radioraxxla.com

<VirtualHost *:80>
    ServerName api.radioraxxla.com

    ProxyPreserveHost On
    ProxyPass        / http://127.0.0.1:8080/
    ProxyPassReverse / http://127.0.0.1:8080/

    RequestHeader set X-Forwarded-Proto "http"
    LimitRequestBody 1048576

    ErrorLog  ${APACHE_LOG_DIR}/edsmt-api-error.log
    CustomLog ${APACHE_LOG_DIR}/edsmt-api-access.log combined
</VirtualHost>
