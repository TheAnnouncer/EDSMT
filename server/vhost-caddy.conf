# Caddy — append to /etc/caddy/Caddyfile, then:
#   sudo caddy validate --config /etc/caddy/Caddyfile
#   sudo systemctl reload caddy
#
# Caddy gets the certificate itself. Nothing else to do.

api.radioraxxla.com {
    encode gzip
    reverse_proxy 127.0.0.1:8080

    request_body {
        max_size 1MB
    }

    header {
        -Server
        Strict-Transport-Security "max-age=31536000"
        X-Content-Type-Options nosniff
    }

    log {
        output file /var/log/caddy/edsmt-api.log {
            roll_size 10mb
            roll_keep 3
        }
    }
}
