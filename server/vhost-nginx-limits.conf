# Rate limiting for the mining API.
#
#   sudo cp vhost-nginx-limits.conf /etc/nginx/conf.d/edsmt-api-limits.conf
#
# This has to live in conf.d, not in the site file: limit_req_zone is only
# valid in nginx's http context, and a site file is inside server{}.
#
# WHY THIS EXISTS. Submission is deliberately open - every commander running
# EDSMT contributes, so there is no token to hold. That means the only thing
# standing between the database and somebody hammering it is this. It is the
# replacement for the token, not an optional extra.
#
# 10 MB of zone holds roughly 160,000 addresses.

limit_req_zone  $binary_remote_addr  zone=edsmtapi:10m   rate=30r/m;
limit_req_zone  $binary_remote_addr  zone=edsmtread:10m  rate=120r/m;
limit_conn_zone $binary_remote_addr  zone=edsmtconn:10m;
